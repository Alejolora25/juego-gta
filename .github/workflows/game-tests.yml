name: Game regression tests

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install
      - name: Run regression suite
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser smoke test
        run: npm run test:browser
