<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Alejandro — revisión del personaje</title>
 <script type="importmap">{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.23.0/build/playcanvas.mjs"}}</script>
 <style>
  *{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;color:#e9eff3;background:#101b24;font:15px system-ui,sans-serif}header{flex:none;padding:18px 24px;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #33434e}h1{margin:0;font-size:22px}p{margin:5px 0;color:#aebfc9}.tag{align-self:center;color:#82c6c4}main{position:relative;flex:1;min-height:0;background:#ccd3d7}canvas{width:100%;height:100%;display:block}.notice{position:absolute;top:16px;left:22px;color:#32434d;font-size:13px;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-content:center;color:#23333f}footer{flex:none;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}nav{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #405361;background:#21313d;color:#dae5ec;padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#317776;border-color:#5eb4ad;color:white}button:hover{border-color:#91b6c5}#status{color:#90aab9;font-size:12px;flex-basis:100%;margin:0}body[data-capture=true] header,body[data-capture=true] footer,body[data-capture=true] .notice{display:none}body[data-capture=true] main{height:100dvh}
  @media(max-width:600px){header{flex:none;padding:12px 16px}.tag{display:none}footer{flex:none;padding:12px 16px}button{padding:7px 9px;font-size:13px}}
 </style>
</head>
<body>
 <header><div><h1>Alejandro</h1><p>Ingeniero tecnológico · propuesta de personaje</p></div><span class="tag">Diseño para revisión</span></header>
 <main><canvas id="character"></canvas><span class="notice">Arrastra para girar la vista</span><div class="loading" id="loading">Cargando el modelo…</div></main>
 <footer>
  <nav aria-label="Animaciones">
   <button data-clip="Idle" aria-pressed="true">Reposo</button><button data-clip="Walk">Caminar</button><button data-clip="Run">Correr</button><button data-clip="Interact">Acción</button><button data-clip="Combat">Combate</button><button data-clip="Shoot">Disparo</button><button data-clip="TurnLeft">Girar</button><button data-clip="Hit">Impacto</button><button data-clip="Defeated">Derrota</button>
  </nav>
  <nav aria-label="Vistas"><button data-view="front">Frente</button><button data-view="quarter" aria-pressed="true">¾</button><button data-view="side">Perfil</button><button data-view="back">Espalda</button></nav>
  <p id="status">Vista del modelo real. Las animaciones se muestran en el sitio.</p>
 </footer>
 <script type="module" src="./viewer.js"></script>
</body>
</html>
